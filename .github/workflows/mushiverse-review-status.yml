name: MUSHIVERSE private review status
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: One-time RSA-3072 public key (base64 SPKI DER)
        required: true
permissions:
  contents: read
jobs:
  lookup:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read and encrypt Apple review status for the requesting operator
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          REPORT_PUBLIC_KEY: ${{ inputs.public_key }}
        run: node services/review-status/encrypted-report.mjs
