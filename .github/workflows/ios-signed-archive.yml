name: iOS signed archive (manual)
on:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: 'Upload to App Store Connect (requires separate owner authorization)'
        type: boolean
        required: true
        default: false
      repair_approved_certificate:
        description: 'Owner approved: replace development certificate 3WMVSRYMNU only (one-time repair)'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  actions: read
jobs:
  signed-archive:
    runs-on: macos-26-intel
    timeout-minutes: 60
    concurrency:
      group: mushiverse-ios-signed-archive
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: 7Q5539YU7V
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name in repository Actions secrets"; exit 1; fi
          done
          test "$(node -p "require('./capacitor.config.json').appId")" = "com.rikuto.mushiverse"
          umask 077
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          grep -q -- 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8"
          echo 'Apple signing credentials supplied. Authorization and provisioning will be tested by xcodebuild.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install and generate native project
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run build:web
          node scripts/verify-web.mjs
          npx cap sync ios
      - name: Allocate unique TestFlight build number
        run: node scripts/set-signed-build-number.mjs
      - name: Run iOS release structure checks
        run: npm run ios:check
      - name: Declare iOS camera and location permissions
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          set_usage() {
            local key="$1" description="$2"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$key $description" "$PLIST"
            else
              /usr/libexec/PlistBuddy -c "Add :$key string $description" "$PLIST"
            fi
          }
          set_usage NSCameraUsageDescription "昆虫の採集記録を撮影して投稿するためにカメラを使用します。"
          set_usage NSLocationWhenInUseUsageDescription "採集場所を地図に表示するため、使用中のみ位置情報を利用します。"
          set_usage NSPhotoLibraryUsageDescription "採集記録に添付する写真を選ぶために写真ライブラリを使用します。"
      - name: Restore encrypted signing backup from this branch and workflow
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const current = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:context.runId})).data;
            if (context.ref !== 'refs/heads/codex/verified-changes-20261028') throw new Error('Unexpected branch');
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,{...context.repo,name:'mushiverse-signing-identity',per_page:100});
            for (const a of artifacts.sort((a,b)=>b.id-a.id)) {
              if (a.expired || a.workflow_run?.id === context.runId) continue;
              const run = (await github.rest.actions.getWorkflowRun({...context.repo,run_id:a.workflow_run.id})).data;
              if (run.workflow_id !== current.workflow_id || run.head_branch !== 'codex/verified-changes-20261028' || run.event !== 'workflow_dispatch') continue;
              const zip = await github.rest.actions.downloadArtifact({...context.repo,artifact_id:a.id,archive_format:'zip'});
              fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'signing-backup.zip'),Buffer.from(zip.data),{mode:0o600});
              core.info('Encrypted signing backup selected from run '+run.id);
              break;
            }
      - name: Prepare signing identity (restore or explicitly approved repair)
        env:
          ROTATE_APPROVED_CERTIFICATE: ${{ inputs.repair_approved_certificate }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if test -f "$RUNNER_TEMP/signing-backup.zip"; then
            unzip -p "$RUNNER_TEMP/signing-backup.zip" signing-identity.p12 > "$RUNNER_TEMP/signing-identity.p12"
          fi
          node scripts/repair-ios-signing.mjs
      - name: Preserve password-encrypted signing identity for subsequent runners
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mushiverse-signing-identity
          path: ${{ runner.temp }}/signing-identity.p12
          if-no-files-found: ignore
          retention-days: 90
      - name: Archive signed iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mushiverse.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="$SIGNING_SHA1" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
          test -d "$RUNNER_TEMP/Mushiverse.xcarchive/Products/Applications/App.app"
      - name: Export signed IPA for App Store distribution
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mushiverse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/MushiverseIPA" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          find "$RUNNER_TEMP/MushiverseIPA" -maxdepth 1 -name '*.ipa' -type f | grep -q .
          echo "Signed IPA exported. No upload to TestFlight was performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Save signed IPA (restricted access recommended)
        uses: actions/upload-artifact@v4
        with:
          name: mushiverse-signed-ipa
          path: ${{ runner.temp }}/MushiverseIPA/*.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Upload IPA to App Store Connect for TestFlight
        if: ${{ inputs.upload_to_testflight }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          chmod 700 "$HOME/.appstoreconnect/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          IPA="$(find "$RUNNER_TEMP/MushiverseIPA" -maxdepth 1 -name '*.ipa' -type f -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo 'IPA submitted to App Store Connect; Apple processing and TestFlight acceptance are pending.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove upload API key
        if: always()
        shell: bash
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Remove API key
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/signing.key" "$RUNNER_TEMP/signing.csr" "$RUNNER_TEMP/signing.cer" "$RUNNER_TEMP/signing.pem" "$RUNNER_TEMP/signing-identity.p12" "$RUNNER_TEMP/signing-backup.zip"
          if test -f "$RUNNER_TEMP/mushiverse-signing.keychain-db"; then
            security delete-keychain "$RUNNER_TEMP/mushiverse-signing.keychain-db"
          fi
