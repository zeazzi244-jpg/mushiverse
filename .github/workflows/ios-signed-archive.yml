name: iOS signed archive (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-archive:
    runs-on: macos-latest
    timeout-minutes: 60
    concurrency:
      group: mushiverse-ios-signed-archive
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: 7Q5539YU7V
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard signing configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            if [[ -z "${!name:-}" ]]; then echo "::error::Missing $name in repository Actions secrets"; exit 1; fi
          done
          test "$(node -p "require('./capacitor.config.json').appId")" = "com.rikuto.mushiverse"
          umask 077
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/AuthKey.p8"
          grep -q -- 'BEGIN PRIVATE KEY' "$RUNNER_TEMP/AuthKey.p8"
          echo 'Apple signing credentials supplied. Authorization and provisioning will be tested by xcodebuild.' >> "$GITHUB_STEP_SUMMARY"
      - name: Install and generate native project
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build:web
          node scripts/verify-web.mjs
          npx cap add ios
      - name: Declare iOS camera and location permissions
        shell: bash
        run: |
          set -euo pipefail
          PLIST="ios/App/App/Info.plist"
          test -f "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string '昆虫の採集記録を撮影して投稿するためにカメラを使用します。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string '採集場所を地図に表示するため、使用中のみ位置情報を利用します。'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string '採集記録に添付する写真を選ぶために写真ライブラリを使用します。'" "$PLIST"
      - name: Archive signed iPhone app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Mushiverse.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive
          test -d "$RUNNER_TEMP/Mushiverse.xcarchive/Products/Applications/App.app"
      - name: Export signed IPA for App Store distribution
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Mushiverse.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/MushiverseIPA" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          find "$RUNNER_TEMP/MushiverseIPA" -maxdepth 1 -name '*.ipa' -type f | grep -q .
          echo "Signed IPA exported. No upload to TestFlight was performed." >> "$GITHUB_STEP_SUMMARY"
      - name: Save signed IPA (restricted access recommended)
        uses: actions/upload-artifact@v4
        with:
          name: mushiverse-signed-ipa
          path: ${{ runner.temp }}/MushiverseIPA/*.ipa
          if-no-files-found: error
          retention-days: 1
      - name: Remove API key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
