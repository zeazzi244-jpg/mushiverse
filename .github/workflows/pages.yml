name: Deploy MUSHIVERSE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build public release assets
        run: npm run build:web
      - name: Verify public entry point
        run: test -s www/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
          name: github-pages-${{ github.run_attempt }}
      # GitHub's artifact metadata API can lag behind a successful upload.
      - name: Allow Pages artifact metadata to propagate
        run: sleep 30
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
# Redeploy after Pages activation
