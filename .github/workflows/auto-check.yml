name: MUSHIVERSE 5-minute health check
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mushiverse-health-check
  cancel-in-progress: true
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build web and run release regression tests
        run: npm run test:release
      - name: Report current commit
        if: always()
        run: echo "Checked commit $GITHUB_SHA"
