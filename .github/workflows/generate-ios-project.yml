name: Generate iOS Xcode project
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/build-web.mjs'
      - '.github/workflows/generate-ios-project.yml'
permissions:
  contents: read
jobs:
  generate-native:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prepare local web bundle
        run: |
          npm run build:web
          node scripts/verify-web.mjs
      - name: Generate Capacitor iOS project
        run: npx cap add ios
      - name: Check native project files
        run: |
          test -f ios/App/App.xcodeproj/project.pbxproj
          echo 'Native project exists; dependency manager may be Swift Package Manager or CocoaPods.'
          echo "Xcode project generated; unsigned simulator compilation runs next; NOT signed or archived" >> "$GITHUB_STEP_SUMMARY"
          echo "Verify camera/privacy declarations and Apple signing before App Store submission." >> "$GITHUB_STEP_SUMMARY"
      - name: Compile unsigned iOS Simulator app
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mushiverse-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/mushiverse-ios-build.log"
          echo "### iOS Simulator build: SUCCEEDED (unsigned)" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify and package compiled simulator app
        run: |
          APP="$RUNNER_TEMP/mushiverse-derived/Build/Products/Debug-iphonesimulator/App.app"
          test -d "$APP"
          test -f "$APP/Info.plist"
          ACTUAL_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          EXPECTED_ID=$(node -p "require('./capacitor.config.json').appId")
          echo "Compiled Bundle ID: $ACTUAL_ID"
          test "$ACTUAL_ID" = "$EXPECTED_ID"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" > /dev/null
          echo "### Verified: unsigned iOS Simulator .app exists" >> "$GITHUB_STEP_SUMMARY"
          echo "This artifact is for Simulator only, not a signed iPhone install or TestFlight upload." >> "$GITHUB_STEP_SUMMARY"
      - name: Save compiled simulator app
        uses: actions/upload-artifact@v4
        with:
          name: mushiverse-ios-simulator-app
          path: ${{ runner.temp }}/mushiverse-derived/Build/Products/Debug-iphonesimulator/App.app/
          if-no-files-found: error
          retention-days: 7
      - name: Save compile log on failure
        if: failure()
        run: |
          if test -f "$RUNNER_TEMP/mushiverse-ios-build.log"; then
            cp "$RUNNER_TEMP/mushiverse-ios-build.log" ios-build.log
          fi
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mushiverse-ios-build-log
          path: ios-build.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save Xcode project for follow-up work
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mushiverse-ios-unsigned-project
          path: |
            ios/
            capacitor.config.json
            package.json
          if-no-files-found: warn
          retention-days: 7
