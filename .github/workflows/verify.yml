name: Verify MUSHIVERSE release scripts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Syntax-check iOS release scripts
        run: |
          node --check scripts/build-web.mjs
          node --check scripts/apply-ios-icon.mjs
          node --check scripts/prepare-ios.mjs
          node --check scripts/check-ios-release.mjs
      - name: Build local web assets
        run: npm run build:web
      - name: Run release regression tests
        run: node --test tests/release.test.mjs
      - name: Verify bundled web entry
        run: test -s www/index.html
      - name: Verify native bundle identity
        run: node -e "const c=require('./capacitor.config.json'); if(c.appId!=='com.rikuto.mushiverse'||c.webDir!=='www'||c.server?.url) process.exit(1)"
      - name: Verify checked-in native release assets
        run: npm run ios:check
