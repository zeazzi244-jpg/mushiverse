name: Verify MUSHIVERSE release scripts
on:
  push:
    branches: [main, codex/pr2-conflict-resolution]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax-check iOS release scripts
        run: |
          node --check scripts/build-web.mjs
          node --check scripts/apply-ios-icon.mjs
          node --check scripts/prepare-ios.mjs
          node --check scripts/check-ios-release.mjs
      - name: Build local web assets
        run: npm run build:web
      - name: Run release regression tests
        run: node --test tests/release.test.mjs
      - name: Verify bundled web entry
        run: test -s www/index.html
      - name: Verify native bundle identity
        run: node -e "const c=require('./capacitor.config.json'); if(c.appId!=='com.rikuto.mushiverse'||c.webDir!=='www'||c.server?.url) process.exit(1)"
      - name: Verify complete native release assets
        run: npm run ios:check
      - name: Verify missing native release assets are rejected
        run: |
          icon=assets/MUSHIVERSE-AppIcon-1024.png
          mv "$icon" "$RUNNER_TEMP/approved-icon.png"
          trap 'mv "$RUNNER_TEMP/approved-icon.png" "$icon"' EXIT
          if npm run ios:check > "$RUNNER_TEMP/incomplete-ios.log" 2>&1; then
            echo 'ERROR: release check passed without required native icon/build assets'
            exit 1
          fi
          cat "$RUNNER_TEMP/incomplete-ios.log"
          grep -F 'Approved iOS icon files are missing' "$RUNNER_TEMP/incomplete-ios.log"
