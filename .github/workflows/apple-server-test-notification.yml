name: Apple App Store Server TEST delivery
on:
  push:
    paths:
      - '.github/workflows/apple-server-test-notification.yml'
      - 'scripts/check-apple-server-notification.mjs'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Apple TEST delivery environment (not a purchase)'
        required: true
        default: 'Sandbox'
        type: choice
        options:
          - Sandbox
          - Production
permissions:
  contents: read
jobs:
  apple-test-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      APPLE_IAP_TEST_ENVIRONMENT: ${{ inputs.environment }}
      APPLE_IAP_KEY_ID: ${{ secrets.APPLE_IAP_KEY_ID }}
      # Non-secret Issuer ID verified in the App Store Connect In-App Purchase API screen.
      APPLE_IAP_ISSUER_ID: 8473c9e7-3897-4f00-bb31-a0b188f8a077
      APPLE_IAP_PRIVATE_KEY_P8: ${{ secrets.APPLE_IAP_PRIVATE_KEY_P8 }}
      APPLE_IAP_PRIVATE_KEY_P8_BASE64: ${{ secrets.APPLE_IAP_PRIVATE_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check dedicated Apple In-App Purchase API key configuration
        shell: bash
        run: |
          set -euo pipefail
          for secret in APPLE_IAP_KEY_ID; do
            if [[ -z "${!secret:-}" ]]; then
              echo "::error::Missing $secret (dedicated Apple In-App Purchase API key)"
              exit 1
            fi
          done
          if [[ -z "${APPLE_IAP_PRIVATE_KEY_P8:-}" && -z "${APPLE_IAP_PRIVATE_KEY_P8_BASE64:-}" ]]; then
            echo "::error::Missing APPLE_IAP_PRIVATE_KEY_P8 (paste the .p8 private key as a GitHub Actions secret)."
            exit 1
          fi
      - name: Run Apple TEST notification check
        run: node scripts/check-apple-server-notification.mjs
