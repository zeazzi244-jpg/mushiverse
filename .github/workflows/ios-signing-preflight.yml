name: iOS signing readiness
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only App Store Connect authorization probe
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node scripts/apple-signing-preflight.mjs
      - name: Read-only signing certificate inventory
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: node scripts/inspect-apple-certificates.mjs
      - name: Report readiness without claiming signed build
        if: always()
        run: |
          echo '### Signing readiness (read-only; no provisioning or upload)' >> "$GITHUB_STEP_SUMMARY"
          if test -f signing-readiness.json; then
            cat signing-readiness.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signing-readiness
          path: signing-readiness.json
          if-no-files-found: error
          retention-days: 7
