name: iOS signing readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signing-preflight:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate App Store Connect signing configuration
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8_BASE64 APPLE_TEAM_ID; do
            if test -z "${!name:-}"; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          test "$(node -p "require('./capacitor.config.json').appId")" = 'com.rikuto.mushiverse'
          KEY_FILE="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          grep -q 'BEGIN PRIVATE KEY' "$KEY_FILE"
          rm -f "$KEY_FILE"
          echo "Secret presence and local format checks passed. This does not confirm Apple authorization, signing or uploads." >> "$GITHUB_STEP_SUMMARY"
