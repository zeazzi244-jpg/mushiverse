name: Web bundle integrity
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'tests/**'
      - 'supabase/**'
      - 'ios/**'
      - 'playwright.config.mjs'
      - 'package-lock.json'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/web-bundle-check.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-web-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Type-check Apple credit function
        run: npx deno check --no-config --node-modules-dir=manual supabase/functions/credit-apple-gacha-coins/index.ts
      - run: npm run verify:web
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Summarize last browser actions on failure
        if: failure()
        shell: python
        run: |
          import glob,json,zipfile
          for archive in glob.glob('test-results/**/trace.zip',recursive=True):
              print('Trace:',archive)
              with zipfile.ZipFile(archive) as trace:
                  for name in trace.namelist():
                      if not name.endswith('.trace'): continue
                      events=[]
                      for line in trace.read(name).decode('utf-8').splitlines():
                          try: event=json.loads(line)
                          except ValueError: continue
                          if event.get('type')=='before':
                              events.append({key:event.get(key) for key in ('callId','apiName','startTime')})
                          elif event.get('type')=='after' and event.get('error'):
                              events.append({'callId':event.get('callId'),'endTime':event.get('endTime'),'error':str(event['error'])[:500]})
                      print(json.dumps(events[-15:],ensure_ascii=False))
      - name: Save browser failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 5
      - name: Syntax-check build and release scripts
        run: |
          node --check scripts/build-web.mjs
          node --check scripts/verify-web.mjs
          node --check scripts/check-ios-release.mjs
      - name: Generate web bundle
        run: npm run build:web
      - name: Check bundle integrity
        run: node scripts/verify-web.mjs
      - name: Report native iOS readiness (informational)
        if: always()
        shell: bash
        run: |
          if npm run ios:check > ios-readiness.txt 2>&1; then
            echo "### iOS structural preflight: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### iOS structural preflight: BLOCKED (expected until native setup)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Preflight checks structure only; no signed build or App Store submission.' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          cat ios-readiness.txt >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
