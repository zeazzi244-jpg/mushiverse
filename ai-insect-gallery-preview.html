<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MUSHIVERSE AI昆虫図鑑プレビュー</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#101a20;color:#f3f7f8}header{position:sticky;top:0;background:#101a20f2;padding:16px;z-index:2;border-bottom:1px solid #324650}h1{font-size:1.3rem;margin:0 0 12px}.tools{display:flex;flex-wrap:wrap;gap:8px}button,input{background:#1b303a;color:white;border:1px solid #47606d;border-radius:10px;padding:10px;font-size:16px}button[aria-pressed=true]{background:#267768}input{width:100%;max-width:340px}.stats{margin:12px 0 0;color:#b9c9cc}main{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;padding:16px}.card{background:#1c2932;border:1px solid #40515b;border-radius:15px;overflow:hidden}.card.sr{border-color:#73b5c4}.card.ssr{border-color:#d5aa52;box-shadow:0 0 14px #a57b243b}.art{aspect-ratio:1;display:grid;place-items:center;background:linear-gradient(145deg,#263943,#10191f);color:#b4c8d0;font-size:12px;text-align:center;padding:12px}.details{padding:10px}.name{font-weight:700;margin:7px 0;overflow-wrap:anywhere}.meta{display:flex;justify-content:space-between;color:#d1dce0;font-size:12px}.tag{border-radius:5px;background:#334954;padding:3px 7px}.ssr .tag{background:#896326}#error{padding:16px;color:#ffb8a6}
</style></head><body><header><h1>AI昆虫ガチャ図鑑（開発用）</h1><div class="tools"><input id="search" type="search" placeholder="名前・番号で検索" aria-label="名前・番号で検索"><div id="filters" class="tools"></div></div><p class="stats" id="stats">読み込み中…</p></header><div id="error" role="alert"></div><main id="cards"></main>
<script>
(async()=>{
const root=document.getElementById('cards'),stats=document.getElementById('stats'),filters=document.getElementById('filters'),search=document.getElementById('search'),error=document.getElementById('error');
let data;try{const res=await fetch('./docs/ai_insect_catalog_v1.json',{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);data=(await res.json()).cards;if(!Array.isArray(data))throw new Error('Invalid catalog');}catch(e){stats.textContent='読み込み失敗';error.textContent='JSONマスタを読み込めません: '+e.message;return;}
let rarity='ALL';for(const r of ['ALL','N','R','SR','SSR']){const b=document.createElement('button');b.textContent=r==='ALL'?'すべて':r;b.setAttribute('aria-pressed',String(r===rarity));b.addEventListener('click',()=>{rarity=r;for(const x of filters.children)x.setAttribute('aria-pressed',String(x===b));render()});filters.append(b)}
function render(){root.replaceChildren();const q=search.value.trim().toLocaleLowerCase('ja');const found=data.filter(c=>(rarity==='ALL'||c.rarity===rarity)&&(c.name.toLocaleLowerCase('ja').includes(q)||c.id.toLocaleLowerCase().includes(q)||c.id.slice(-3).includes(q)));stats.textContent=found.length+' / '+data.length+'種類を表示（画像は未登録）';for(const c of found){const card=document.createElement('article');card.className='card '+c.rarity.toLowerCase();const art=document.createElement('div');art.className='art';art.textContent='画像準備中';const details=document.createElement('div');details.className='details';const meta=document.createElement('div');meta.className='meta';const id=document.createElement('span');id.textContent=c.id;const tag=document.createElement('span');tag.className='tag';tag.textContent=c.rarity;meta.append(id,tag);const name=document.createElement('div');name.className='name';name.textContent=c.name;details.append(meta,name);card.append(art,details);root.append(card)}}
search.addEventListener('input',render);render();
})();
</script></body></html>
